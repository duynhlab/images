# Tag <image>/vX.Y.Z -> build through _build.yml, push that exact archive as
# ghcr.io/duynhlab/images/<image>:X.Y.Z, check the registry digest, sign it
# (cosign keyless), attest provenance and publish a GitHub Release with the
# reference to pin. Consumers verify the signature against this workflow's
# identity, so its path and tag pattern are part of the contract.
name: release

on:
  push:
    tags:
      - "*/v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.parse.outputs.image }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse the tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^([a-z0-9-]+)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag ${TAG} is not <image>/vX.Y.Z"; exit 1; }
          image=${BASH_REMATCH[1]}; version=${BASH_REMATCH[2]}
          [[ -f "images/${image}/image.yaml" ]] || { echo "::error::no images/${image}/image.yaml"; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build.yml
    with:
      image: ${{ needs.meta.outputs.image }}
      version: ${{ needs.meta.outputs.version }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.meta.outputs.image }}
      VERSION: ${{ needs.meta.outputs.version }}
      REFERENCE: ${{ needs.build.outputs.reference }}
    steps:
      - name: Fetch the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.meta.outputs.image }}-oci
          path: .out

      - name: Push the exact archive
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=${REFERENCE%@*}; digest=${REFERENCE#*@}
          echo "${GH_TOKEN}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --all --preserve-digests "oci-archive:.out/${IMAGE}.oci.tar" "docker://${image}"
          got="sha256:$(skopeo inspect --raw "docker://${image}" | sha256sum | cut -d' ' -f1)"
          echo "registry digest: ${got}"
          [[ "${got}" == "${digest}" ]] || { echo "::error::pushed digest ${got} != ${digest}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --recursive --oidc-provider=github-actions "ghcr.io/duynhlab/images/${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/duynhlab/images/${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub Release with the reference to pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(printf 'Pin this reference:\n\n```\n%s\n```\n\nSigned keyless by `.github/workflows/release.yml` at `%s`; verify with:\n\n```\ncosign verify --certificate-identity-regexp %s --certificate-oidc-issuer https://token.actions.githubusercontent.com %s\n```\n' \
            "${REFERENCE}" "${TAG}" "'^https://github\.com/duynhlab/images/\.github/workflows/release\.yml@refs/tags/${IMAGE}/v'" "${REFERENCE}")
          gh release create "${TAG}" --repo "${{ github.repository }}" --title "${IMAGE} ${VERSION}" --notes "${notes}" --verify-tag
